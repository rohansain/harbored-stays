spring.application.name=harbored

# Server Configuration
server.port=8080
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# PostgreSQL Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/harbored_db
spring.datasource.username=postgres
spring.datasource.password=postgresql
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Security & JWT Properties
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

# Mail Configuration (Mailtrap Sandbox Defaults)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Cloudinary Storage Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

#Rozorpay configuration
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}


# Rate Limiting Configuration (Token Bucket)
ratelimit.enabled=true
ratelimit.authenticated.capacity=${RATELIMIT_AUTHENTICATED_CAPACITY}
ratelimit.authenticated.refill-tokens-per-minute=${RATELIMIT_AUTHENTICATED_REFILL_TOKENS_PER_MINUTE}
ratelimit.anonymous.capacity=${RATELIMIT_ANONYMOUS_CAPACITY}
ratelimit.anonymous.refill-tokens-per-minute=${RATELIMIT_ANONYMOUS_REFILL_TOKENS_PER_MINUTE}


# Redis Distributed Cache Configuration (Phase 3 - Day 37)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false


